name: HealthTracker
options:
  bundleIdPrefix: com.mikek.healthtracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  HealthTracker:
    type: application
    platform: iOS
    sources:
      - path: HealthTracker
    info:
      path: HealthTracker/Info.plist
      properties:
        CFBundleDisplayName: Health Tracker
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "We read your Apple Watch and Health data (steps, workouts, heart rate, weight, body fat, sleep) to calculate your nutrition and training targets."
        NSHealthUpdateUsageDescription: "We can save body weight and body fat entries you log back to Apple Health."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: HealthTracker/HealthTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikek.healthtracker
        PRODUCT_NAME: HealthTracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
